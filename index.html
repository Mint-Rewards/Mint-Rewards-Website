<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mint Rewards — Get Rewarded for Recycling</title>

  <!--
    DEFAULTS, NOT THE WHOLE STORY. PageMeta rewrites the title, description,
    canonical, robots and og:title/description per route once React mounts.
    What is here is what a crawler sees before any of that runs — and all a
    crawler that runs no JavaScript will ever see. That is the case for
    prerendering, which this file cannot fix on its own.
  -->
  <meta name="description"
    content="Mint Rewards turns household recycling into rewards. Book a free collection, recycle what you already throw away, and earn points to spend with local brands." />
  <link rel="canonical" href="https://www.mintrewards.app/" />
  <meta name="theme-color" content="#0b3d2e" />

  <meta property="og:site_name" content="Mint Rewards" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.mintrewards.app/" />
  <meta property="og:title" content="Mint Rewards — Get Rewarded for Recycling" />
  <meta property="og:description"
    content="Book a free collection, recycle what you already throw away, and earn points to spend with local brands." />
  <!-- 1024x1024. A purpose-made 1200x630 card is still owed; platforms
       centre-crop this one. -->
  <meta property="og:image" content="https://www.mintrewards.app/images/recovery-hero.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mint Rewards — Get Rewarded for Recycling" />
  <meta name="twitter:description"
    content="Book a free collection, recycle what you already throw away, and earn points to spend with local brands." />
  <meta name="twitter:image" content="https://www.mintrewards.app/images/recovery-hero.jpg" />

  <!--
    The organisation itself, stated once for the whole site.

    IN THE DOCUMENT RATHER THAN INJECTED BY REACT, deliberately: this is
    the one piece of structured data a crawler that runs no JavaScript can
    still read, and it is the piece that ties the domain to a real company.

    `sameAs` uses the profiles the footer actually links to
    (contactSocialLinks). constants.ts also holds a `footerSocialLinks`
    with DIFFERENT handles, which nothing imports — do not copy from it.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Mint Rewards",
    "url": "https://www.mintrewards.app/",
    "logo": "https://www.mintrewards.app/favicon.png",
    "description": "Mint Rewards collects household recyclables in Pakistan and rewards people with points they can spend with partner brands.",
    "email": "hello@mymintrewards.com",
    "telephone": "+92 349 2498174",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "5th Floor Amir Trade Centre, PECHS Block 2",
      "addressLocality": "Karachi",
      "addressCountry": "PK"
    },
    "sameAs": [
      "https://www.linkedin.com/company/mintrewards/",
      "https://www.instagram.com/mymintrewards/",
      "https://www.facebook.com/MintRewards"
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
